# Render "Blueprint": tells Render what to create. (Dashboard -> New -> Blueprint)
# Creates: 1 Postgres database, 1 Key Value (Redis) instance, 1 web service (Docker).

databases:
  - name: messenger-db
    plan: free
    databaseName: messenger
    user: messenger

services:
  # Redis: used as the Django Channels layer (live messages between WebSocket connections)
  - type: keyvalue
    name: messenger-redis
    plan: free
    ipAllowList: []          # only services inside my Render account can connect
    maxmemoryPolicy: allkeys-lru

  # The app: Django (API + WebSocket) that also serves the web page
  - type: web
    name: messenger
    runtime: docker          # uses the Dockerfile in the main folder
    plan: free
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECURE_COOKIES
        value: "True"
      - key: DJANGO_SECRET_KEY
        generateValue: true  # Render creates a long random secret
      - key: DATABASE_URL
        fromDatabase:
          name: messenger-db
          property: connectionString
      - key: USE_REDIS
        value: "True"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: messenger-redis
          property: connectionString
