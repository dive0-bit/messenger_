services:
  redis:
    image: redis:7-alpine

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DEBUG: "True"
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:-change-this-before-going-live}"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      CSRF_TRUSTED_ORIGINS: "http://localhost:8000,http://127.0.0.1:8000"
      FRONTEND_URL: "http://localhost:8000"
      USE_REDIS: "True"
      REDIS_URL: "redis://redis:6379"
      DATA_DIR: "/data"   # database file and uploaded pictures live here
    volumes:
      - app_data:/data
    depends_on:
      - redis

volumes:
  app_data:
